---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_2_3_7_8 }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\ScRemoveOption:
    title: "2.3.7.8 | Ensure 'Interactive logon: Smart card removal behavior' is set to 'Lock Workstation' or higher | ScRemoveOption"
    exists: true
    value: '{{ .Vars.win11cis_sc_remove_option }}'
    type: REG_SZ
    meta:
      workstation: 1
      CIS_ID:
        - 2.3.7.8
      NIST800-53R5:
        - AC-11
        - AC-11(1)
        - AC-12
        - AC-2(5)
  {{ end }}
{{ end }}
