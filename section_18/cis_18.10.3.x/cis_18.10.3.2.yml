  HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat\DisableApplicationFootprint:
    title: "18.10.3.2 | Ensure 'Turn off Application Footprint' is set to 'Enabled' | DisableApplicationFootprint"
    exists: true
    value: 1
