---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_9_26_3 }}
    {{ if .Vars.win11cis_domain_joined }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\ADPasswordEncryptionEnabled:
    title: "18.9.26.3 | Ensure 'Enable password encryption' is set to 'Enabled' | ADPasswordEncryptionEnabled"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.9.26.3
      NIST800-53R5:
        - AC-17(2)
        - IA-5
        - IA-5(1)
        - SC-8
        - SC-8(1)
    {{ end }}
  {{ end }}
{{ end }}
