---

{{ if .Vars.win11cis_level_1 }}
  {{ if .Vars.win11cis_rule_18_9_26_2 }}
    {{ if .Vars.win11cis_domain_joined }}
registry:
  HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\LAPS\PwdExpirationProtectionEnabled:
    title: "18.9.26.2 | Ensure 'Do not allow password expiration time longer than required by policy' is set to 'Enabled' | PwdExpirationProtectionEnabled"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      CIS_ID:
        - 18.9.26.2
      NIST800-53R5:
        - IA-5(1)(d)
    {{ end }}
  {{ end }}
{{ end }}
