---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_3_7 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVActiveDirectoryBackup:
    title: "18.10.10.3.7 | Ensure 'Choose how BitLocker-protected removable drives can be recovered: Save BitLocker recovery information to AD DS for removable data drives' is set to 'Enabled: False' | RDVActiveDirectoryBackup"
    exists: true
    value: 0
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.3.7
  {{ end }}
{{ end }}
