---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_3_12 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVAllowUserCert:
    title: "18.10.10.3.12 | Ensure 'Configure use of smart cards on removable data drives' is set to 'Enabled' | RDVAllowUserCert"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.3.12
  {{ end }}
{{ end }}
