---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_3_2 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVRecovery:
    title: "18.10.10.3.2 | Ensure 'Choose how BitLocker-protected removable drives can be recovered' is set to 'Enabled' | RDVRecovery"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.3.2
  {{ end }}
{{ end }}
