---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_1_12 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\FDVAllowUserCert:
    title: "18.10.10.1.12 | Ensure 'Configure use of smart cards on fixed data drives' is set to 'Enabled' | FDVAllowUserCert"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.1.12
  {{ end }}
{{ end }}
