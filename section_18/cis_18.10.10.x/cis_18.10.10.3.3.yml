---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_3_3 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\RDVManageDRA:
    title: "18.10.10.3.3 | Ensure 'Choose how BitLocker-protected removable drives can be recovered: Allow data recovery agent' is set to 'Enabled: True' | RDVManageDRA"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.3.3
  {{ end }}
{{ end }}
