---

{{ if .Vars.win11cis_bitlocker }}
  {{ if .Vars.win11cis_rule_18_10_10_2_5 }}
registry:
  HKLM\SOFTWARE\Policies\Microsoft\FVE\OSRecoveryPassword:
    title: "18.10.10.2.5 | Ensure 'Choose how BitLocker-protected operating system drives can be recovered: Recovery Password' is set to 'Enabled: Require 48-digit recovery password' | OSRecoveryPassword"
    exists: true
    value: 1
    type: REG_DWORD
    meta:
      workstation: 1
      bitlocker: 1
      CIS_ID:
        - 18.10.10.2.5
  {{ end }}
{{ end }}
